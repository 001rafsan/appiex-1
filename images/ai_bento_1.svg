<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" fill="none">
  <defs>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e293b" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1e293b" flood-opacity="0.04"/>
    </filter>
    <filter id="mintGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0d9488" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="mintGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f8f3"/>
      <stop offset="100%" stop-color="#cbf2ea"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Subtle background connection lines -->
  <path d="M135 110 L235 155 M465 110 L365 155 M135 250 L235 205 M465 250 L365 205" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Top-Left Satellite Card: Google SEO Search Node -->
  <g filter="url(#cardShadow)">
    <rect x="55" y="65" width="135" height="76" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="85" cy="103" r="16" fill="#eff6ff"/>
    <!-- Magnifying Glass Icon -->
    <circle cx="83" cy="101" r="6.5" stroke="#3b82f6" stroke-width="2.2"/>
    <path d="M88 106 L93 111" stroke="#3b82f6" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="110" y="88" width="58" height="8" rx="4" fill="#94a3b8"/>
    <rect x="110" y="102" width="42" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="110" y="115" width="48" height="10" rx="5" fill="#dcfce7"/>
    <text x="134" y="123" font-family="sans-serif" font-size="7" font-weight="700" fill="#15803d" text-anchor="middle">SEO #1</text>
  </g>

  <!-- Top-Right Satellite Card: Keyword Traffic Boost -->
  <g filter="url(#cardShadow)">
    <rect x="410" y="65" width="135" height="76" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="440" cy="103" r="16" fill="#f0fdf4"/>
    <!-- Trend Up Arrow -->
    <path d="M433 108 L439 101 L443 105 L449 97 M444 97 H449 V102" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="464" y="88" width="60" height="8" rx="4" fill="#94a3b8"/>
    <rect x="464" y="102" width="46" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="464" y="115" width="54" height="10" rx="5" fill="#e0f8f3"/>
    <text x="491" y="123" font-family="sans-serif" font-size="7" font-weight="700" fill="#0f766e" text-anchor="middle">+340% CTR</text>
  </g>

  <!-- Bottom-Left Satellite Card: Instant Auto-Reply -->
  <g filter="url(#cardShadow)">
    <rect x="55" y="210" width="135" height="76" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="85" cy="248" r="16" fill="#f0fdfa"/>
    <!-- Chat Bubble Icon -->
    <path d="M78 243 H92 V252 H83 L78 256 V243 Z" stroke="#0d9488" stroke-width="2" stroke-linejoin="round"/>
    <rect x="110" y="233" width="58" height="8" rx="4" fill="#94a3b8"/>
    <rect x="110" y="247" width="40" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="110" y="260" width="52" height="10" rx="5" fill="#e0f8f3"/>
    <text x="136" y="268" font-family="sans-serif" font-size="7" font-weight="700" fill="#0f766e" text-anchor="middle">0.2s Reply</text>
  </g>

  <!-- Bottom-Right Satellite Card: Backlinks & Indexing -->
  <g filter="url(#cardShadow)">
    <rect x="410" y="210" width="135" height="76" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="440" cy="248" r="16" fill="#eef2ff"/>
    <!-- Globe / Search Grid Icon -->
    <circle cx="440" cy="248" r="7.5" stroke="#6366f1" stroke-width="2"/>
    <path d="M432.5 248 H447.5 M440 240.5 C442.5 243 442.5 253 440 255.5 C437.5 253 437.5 243 440 240.5 Z" stroke="#6366f1" stroke-width="1.6"/>
    <rect x="464" y="233" width="60" height="8" rx="4" fill="#94a3b8"/>
    <rect x="464" y="247" width="44" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="464" y="260" width="54" height="10" rx="5" fill="#e0e7ff"/>
    <text x="491" y="268" font-family="sans-serif" font-size="7" font-weight="700" fill="#4338ca" text-anchor="middle">AI Indexed</text>
  </g>

  <!-- Center Main Elevated Card: SEO & AI Automation Core -->
  <g filter="url(#mintGlow)">
    <rect x="195" y="52" width="210" height="246" rx="24" fill="#ffffff" stroke="#ffffff" stroke-width="6"/>
    <rect x="203" y="60" width="194" height="230" rx="18" fill="url(#mintGrad)"/>

    <!-- Search Bar Header inside Center Card -->
    <rect x="219" y="78" width="162" height="30" rx="15" fill="#ffffff"/>
    <circle cx="235" cy="93" r="5.5" stroke="#0d9488" stroke-width="2"/>
    <path d="M239 97 L243 101" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
    <rect x="250" y="89" width="78" height="8" rx="4" fill="#94a3b8"/>
    <rect x="338" y="85" width="34" height="16" rx="8" fill="#14b8a6"/>
    <text x="355" y="96" font-family="sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">AI</text>

    <!-- SEO & Reply Growth Bars -->
    <rect x="219" y="122" width="162" height="98" rx="14" fill="#ffffff" fill-opacity="0.88"/>
    <text x="233" y="140" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f766e">SEARCH &amp; AUTO-REPLY SPEED</text>
    
    <!-- Bar chart -->
    <rect x="235" y="182" width="18" height="24" rx="4" fill="#99f6e4"/>
    <rect x="262" y="170" width="18" height="36" rx="4" fill="#5eead4"/>
    <rect x="289" y="156" width="18" height="50" rx="4" fill="#2dd4bf"/>
    <rect x="316" y="146" width="18" height="60" rx="4" fill="url(#barGrad)"/>
    <rect x="343" y="134" width="18" height="72" rx="4" fill="url(#barGrad)"/>

    <!-- Rising Trend Line over Bars -->
    <path d="M244 178 L271 166 L298 152 L325 142 L352 130" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="352" cy="130" r="4" fill="#0f766e"/>

    <!-- Bottom Status Pill inside Center Card -->
    <rect x="219" y="234" width="162" height="38" rx="12" fill="#ffffff"/>
    <circle cx="239" cy="253" r="10" fill="#ccfbf1"/>
    <path d="M235 253 L238 256 L244 250" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="256" y="245" width="84" height="7" rx="3.5" fill="#64748b"/>
    <rect x="256" y="256" width="56" height="6" rx="3" fill="#94a3b8"/>
    <text x="362" y="257" font-family="sans-serif" font-size="10" font-weight="800" fill="#0d9488" text-anchor="middle">24/7</text>
  </g>
</svg>