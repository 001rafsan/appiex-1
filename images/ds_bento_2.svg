<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 504 250" width="504" height="250" fill="none">
  <defs>
    <filter id="pShadow2" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4c1d95" flood-opacity="0.12"/>
    </filter>
    <filter id="pGlow2" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#8b5cf6" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="prismGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="pCardBg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>

  <!-- Left: 3D Precision Target Orb -->
  <g filter="url(#pGlow2)">
    <circle cx="106" cy="125" r="54" fill="#ffffff" stroke="#f3e8ff" stroke-width="4"/>
    <circle cx="106" cy="125" r="46" fill="url(#pCardBg2)"/>
    
    <!-- Concentric Rings & Crosshair -->
    <circle cx="106" cy="125" r="32" stroke="#c4b5fd" stroke-width="1.8" stroke-dasharray="4 3"/>
    <circle cx="106" cy="125" r="20" stroke="#8b5cf6" stroke-width="2.5" fill="#ffffff"/>
    <circle cx="106" cy="125" r="9" fill="url(#prismGrad)"/>
    <circle cx="104" cy="123" r="2" fill="#ffffff"/>

    <!-- Pointer rays -->
    <line x1="106" y1="84" x2="106" y2="92" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="106" y1="158" x2="106" y2="166" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="65" y1="125" x2="73" y2="125" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="139" y1="125" x2="147" y2="125" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Flow Connector with glowing pill -->
  <path d="M164 125 H228" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="5 4"/>
  <g filter="url(#pShadow2)">
    <rect x="176" y="103" width="46" height="44" rx="14" fill="#ffffff" stroke="#ede9fe" stroke-width="1.5"/>
    <text x="199" y="129" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="9.5" font-weight="900" fill="#7c3aed" text-anchor="middle">ROAS</text>
  </g>

  <!-- Right: 3D Multi-Stage Funnel & Yield Optimizer Window -->
  <g filter="url(#pShadow2)">
    <rect x="236" y="32" width="228" height="186" rx="22" fill="#ffffff" stroke="#ede9fe" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <circle cx="258" cy="50" r="3.5" fill="#c4b5fd"/>
    <circle cx="270" cy="50" r="3.5" fill="#c4b5fd"/>
    <circle cx="282" cy="50" r="3.5" fill="#c4b5fd"/>
    <rect x="298" y="46" width="76" height="8" rx="4" fill="#ede9fe"/>
    
    <rect x="390" y="43" width="58" height="15" rx="7.5" fill="#f3e8ff"/>
    <text x="419" y="54" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="7.5" font-weight="800" fill="#7c3aed" text-anchor="middle">5.4x BLENDED</text>

    <!-- Inner Purple Tinted Dashboard -->
    <rect x="248" y="66" width="204" height="140" rx="15" fill="url(#pCardBg2)"/>

    <!-- Funnel Tier 1: Top of Funnel (Awareness & Traffic) -->
    <rect x="260" y="78" width="180" height="34" rx="10" fill="#ffffff"/>
    <rect x="270" y="87" width="86" height="16" rx="8" fill="#e9d5ff"/>
    <circle cx="278" cy="95" r="4" fill="#8b5cf6"/>
    <text x="316" y="99" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="8" font-weight="800" fill="#6d28d9">AD TRAFFIC</text>
    <text x="424" y="99" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#7c3aed" text-anchor="end">100%</text>

    <!-- Funnel Tier 2: Mid-Funnel (High Intent Retargeting) -->
    <rect x="260" y="118" width="180" height="34" rx="10" fill="#ffffff"/>
    <rect x="270" y="127" width="102" height="16" rx="8" fill="#c084fc"/>
    <circle cx="278" cy="135" r="4" fill="#ffffff"/>
    <text x="325" y="139" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="8" font-weight="800" fill="#ffffff">QUALIFIED LEADS</text>
    <text x="424" y="139" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#7c3aed" text-anchor="end">48.5%</text>

    <!-- Funnel Tier 3: Bottom of Funnel (Closed High-LTV Sales) -->
    <rect x="260" y="158" width="180" height="34" rx="10" fill="url(#purpleGrad1)"/>
    <circle cx="278" cy="175" r="6" fill="#ffffff"/>
    <path d="M275 175 L277 177 L281 173" stroke="#6d28d9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="292" y="179" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">ZERO BUDGET LEAK</text>
    <rect x="388" y="166" width="42" height="18" rx="9" fill="#ffffff"/>
    <text x="409" y="178" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="8.5" font-weight="900" fill="#6d28d9" text-anchor="middle">PROFIT</text>
  </g>
</svg>