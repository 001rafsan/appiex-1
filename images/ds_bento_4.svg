<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" fill="none">
  <defs>
    <filter id="pShadow4" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4c1d95" flood-opacity="0.14"/>
    </filter>
    <filter id="pGlow4" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="22" flood-color="#8b5cf6" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="purpleArcGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="purpleArcArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="pCardBg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>

  <!-- Left Dashed Background Window: Customer Journey Matrix -->
  <rect x="46" y="86" width="184" height="178" rx="20" fill="#ffffff" fill-opacity="0.75" stroke="#ddd6fe" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="66" cy="106" r="3.5" fill="#c4b5fd"/>
  <circle cx="76" cy="106" r="3.5" fill="#c4b5fd"/>
  <circle cx="86" cy="106" r="3.5" fill="#c4b5fd"/>
  <rect x="102" y="102" width="70" height="8" rx="4" fill="#c4b5fd"/>
  
  <rect x="66" y="128" width="112" height="10" rx="5" fill="#ede9fe"/>
  <rect x="66" y="146" width="88" height="8" rx="4" fill="#ede9fe"/>
  <rect x="66" y="162" width="98" height="8" rx="4" fill="#ede9fe"/>
  <rect x="66" y="184" width="84" height="20" rx="10" fill="#f3e8ff"/>
  <text x="108" y="197" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#7c3aed" text-anchor="middle">FUNNEL FLOW</text>

  <!-- Right Dashed Background Window: Retention & LTV Model -->
  <rect x="370" y="86" width="184" height="178" rx="20" fill="#ffffff" fill-opacity="0.75" stroke="#ddd6fe" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="390" cy="106" r="3.5" fill="#c4b5fd"/>
  <circle cx="400" cy="106" r="3.5" fill="#c4b5fd"/>
  <circle cx="410" cy="106" r="3.5" fill="#c4b5fd"/>
  <rect x="426" y="102" width="70" height="8" rx="4" fill="#c4b5fd"/>
  
  <rect x="390" y="128" width="112" height="10" rx="5" fill="#ede9fe"/>
  <rect x="390" y="146" width="88" height="8" rx="4" fill="#ede9fe"/>
  <rect x="390" y="162" width="98" height="8" rx="4" fill="#ede9fe"/>
  <rect x="390" y="184" width="84" height="20" rx="10" fill="#f3e8ff"/>
  <text x="432" y="197" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#7c3aed" text-anchor="middle">LTV RETENTION</text>

  <!-- Center Elevated Window: Conversion & Revenue Accelerator -->
  <g filter="url(#pShadow4)">
    <rect x="172" y="50" width="256" height="248" rx="24" fill="#ffffff" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Window Header -->
    <circle cx="196" cy="74" r="4" fill="#c4b5fd"/>
    <circle cx="208" cy="74" r="4" fill="#c4b5fd"/>
    <circle cx="220" cy="74" r="4" fill="#c4b5fd"/>
    <rect x="240" y="69" width="116" height="10" rx="5" fill="#ede9fe"/>
    
    <circle cx="404" cy="74" r="4.5" fill="#8b5cf6"/>

    <!-- Inner Purple Tinted Area -->
    <rect x="184" y="90" width="232" height="196" rx="18" fill="url(#pCardBg4)"/>

    <!-- Search / Strategy Command Bar -->
    <rect x="198" y="106" width="204" height="34" rx="17" fill="#ffffff"/>
    <circle cx="218" cy="123" r="7" stroke="#7c3aed" stroke-width="2.2" fill="none"/>
    <path d="M223 128 L228 133" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round"/>
    <text x="238" y="126" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#4c1d95">Revenue Acceleration Hub</text>
    <rect x="348" y="113" width="46" height="20" rx="10" fill="#7c3aed"/>
    <text x="371" y="126" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle">LIVE</text>

    <!-- Two Metric Tiles in Center -->
    <rect x="198" y="148" width="98" height="36" rx="11" fill="#ffffff" fill-opacity="0.95"/>
    <text x="247" y="162" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">CONVERSION RATE</text>
    <text x="247" y="176" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="11.5" font-weight="900" fill="#7c3aed" text-anchor="middle">+280% Sales</text>

    <rect x="304" y="148" width="98" height="36" rx="11" fill="#ffffff" fill-opacity="0.95"/>
    <text x="353" y="162" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">REVENUE SCALE</text>
    <text x="353" y="176" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="11.5" font-weight="900" fill="#7c3aed" text-anchor="middle">3.8x Growth</text>

    <!-- Bottom Parabolic Curve Box -->
    <rect x="198" y="192" width="204" height="82" rx="14" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M212 258 L244 246 L278 238 L314 222 L350 208 L386 196 L386 264 L212 264 Z" fill="url(#purpleArcArea)"/>
    <path d="M212 258 L244 246 L278 238 L314 222 L350 208 L386 196" stroke="url(#purpleArcGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Milestone Glow Nodes along the curve -->
    <circle cx="278" cy="238" r="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2.5"/>
    <circle cx="350" cy="208" r="4.5" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
    <circle cx="386" cy="196" r="5.5" fill="#7c3aed"/>
    <circle cx="386" cy="196" r="2" fill="#ffffff"/>
  </g>
</svg>