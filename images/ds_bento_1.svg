<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" fill="none">
  <defs>
    <filter id="pShadow1" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4c1d95" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.06"/>
    </filter>
    <filter id="pGlow1" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#8b5cf6" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="purpleGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="purpleBgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="starGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="starGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>

  <!-- Ambient Radar Matrix Rings -->
  <g opacity="0.85">
    <!-- Outer dashed orbit -->
    <ellipse cx="300" cy="175" rx="220" ry="120" stroke="#ddd6fe" stroke-width="1.5" stroke-dasharray="6 6"/>
    <!-- Middle orbit -->
    <ellipse cx="300" cy="175" rx="160" ry="86" stroke="#c4b5fd" stroke-width="1.8"/>
    <!-- Inner orbit -->
    <ellipse cx="300" cy="175" rx="100" ry="54" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Radar Sweep Beam (Radial Cone) -->
    <path d="M300 175 L460 110 A160 86 0 0 1 480 155 Z" fill="url(#purpleGrad1)" opacity="0.12"/>
    <line x1="300" y1="175" x2="460" y2="110" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Crosshair Axis Lines -->
    <line x1="80" y1="175" x2="520" y2="175" stroke="#e9d5ff" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="300" y1="50" x2="300" y2="300" stroke="#e9d5ff" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>

  <!-- Orbiting Trajectory Connecting Dots -->
  <path d="M125 105 Q200 65 300 65 T475 105" stroke="#a855f7" stroke-width="2" stroke-dasharray="5 5" fill="none" opacity="0.6"/>

  <!-- Satellite Card 1: Top Left - Target Audience -->
  <g filter="url(#pShadow1)">
    <rect x="42" y="62" width="150" height="78" rx="18" fill="#ffffff" stroke="#ede9fe" stroke-width="1.5"/>
    <circle cx="72" cy="101" r="17" fill="#f5f3ff"/>
    <!-- Target Crosshair Icon -->
    <circle cx="72" cy="101" r="8" stroke="#7c3aed" stroke-width="2.2" fill="none"/>
    <circle cx="72" cy="101" r="3" fill="#7c3aed"/>
    <line x1="72" y1="89" x2="72" y2="92" stroke="#7c3aed" stroke-width="2"/>
    <line x1="72" y1="110" x2="72" y2="113" stroke="#7c3aed" stroke-width="2"/>
    <line x1="60" y1="101" x2="63" y2="101" stroke="#7c3aed" stroke-width="2"/>
    <line x1="81" y1="101" x2="84" y2="101" stroke="#7c3aed" stroke-width="2"/>

    <rect x="98" y="84" width="76" height="8" rx="4" fill="#6d28d9"/>
    <rect x="98" y="98" width="52" height="6" rx="3" fill="#c4b5fd"/>
    <rect x="98" y="110" width="64" height="13" rx="6.5" fill="#f3e8ff"/>
    <text x="130" y="120" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#7c3aed" text-anchor="middle">TARGET ICP: 99%</text>
  </g>

  <!-- Satellite Card 2: Top Right - North Star Growth -->
  <g filter="url(#pShadow1)">
    <rect x="408" y="62" width="150" height="78" rx="18" fill="#ffffff" stroke="#ede9fe" stroke-width="1.5"/>
    <circle cx="438" cy="101" r="17" fill="#f5f3ff"/>
    <!-- Trend Sparkline Icon -->
    <path d="M430 106 L436 99 L440 103 L446 95 M441 95 H446 V100" stroke="#8b5cf6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="464" y="84" width="76" height="8" rx="4" fill="#6d28d9"/>
    <rect x="464" y="98" width="50" height="6" rx="3" fill="#c4b5fd"/>
    <rect x="464" y="110" width="66" height="13" rx="6.5" fill="#f3e8ff"/>
    <text x="497" y="120" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#7c3aed" text-anchor="middle">+350% NORTH STAR</text>
  </g>

  <!-- Satellite Card 3: Bottom Left - Brand Positioning -->
  <g filter="url(#pShadow1)">
    <rect x="42" y="208" width="150" height="78" rx="18" fill="#ffffff" stroke="#ede9fe" stroke-width="1.5"/>
    <circle cx="72" cy="247" r="17" fill="#f5f3ff"/>
    <!-- Gemstone / Apex Diamond Icon -->
    <path d="M72 237 L80 244 L77 256 L67 256 L64 244 Z" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <path d="M64 244 H80 M72 237 L69 256 M72 237 L75 256" stroke="#c084fc" stroke-width="1.2"/>
    <rect x="98" y="230" width="72" height="8" rx="4" fill="#6d28d9"/>
    <rect x="98" y="244" width="46" height="6" rx="3" fill="#c4b5fd"/>
    <rect x="98" y="256" width="62" height="13" rx="6.5" fill="#f3e8ff"/>
    <text x="129" y="266" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#7c3aed" text-anchor="middle">CATEGORY KING</text>
  </g>

  <!-- Satellite Card 4: Bottom Right - Execution Roadmap -->
  <g filter="url(#pShadow1)">
    <rect x="408" y="208" width="150" height="78" rx="18" fill="#ffffff" stroke="#ede9fe" stroke-width="1.5"/>
    <circle cx="438" cy="247" r="17" fill="#f5f3ff"/>
    <!-- Timeline Stepped Checkmark Icon -->
    <rect x="430" y="240" width="16" height="14" rx="4" stroke="#7c3aed" stroke-width="2" fill="none"/>
    <path d="M434 247 L437 250 L442 244" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="464" y="230" width="72" height="8" rx="4" fill="#6d28d9"/>
    <rect x="464" y="244" width="48" height="6" rx="3" fill="#c4b5fd"/>
    <rect x="464" y="256" width="64" height="13" rx="6.5" fill="#f3e8ff"/>
    <text x="496" y="266" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#7c3aed" text-anchor="middle">Q1–Q4 SPRINT</text>
  </g>

  <!-- CENTER PIECE: 3D Faceted Purple Compass & Growth Core -->
  <g filter="url(#pGlow1)">
    <!-- Main Center Outer White Disc -->
    <circle cx="300" cy="175" r="74" fill="#ffffff" stroke="#f3e8ff" stroke-width="5"/>
    <circle cx="300" cy="175" r="66" fill="url(#purpleBgGrad)"/>
    
    <!-- Outer Degree Ticks -->
    <circle cx="300" cy="175" r="54" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="2 6"/>
    
    <!-- Compass Rose Faceted Star (3D shaded) -->
    <!-- North Arrow (pointing Top-Right towards Growth) -->
    <path d="M300 175 L332 124 L308 170 Z" fill="url(#starGrad1)"/>
    <path d="M300 175 L332 124 L296 168 Z" fill="url(#starGrad2)"/>
    <!-- South Arrow -->
    <path d="M300 175 L268 226 L292 180 Z" fill="#6d28d9" opacity="0.7"/>
    <path d="M300 175 L268 226 L304 182 Z" fill="#4c1d95" opacity="0.8"/>
    <!-- East Arrow -->
    <path d="M300 175 L346 195 L306 182 Z" fill="#7c3aed" opacity="0.6"/>
    <path d="M300 175 L346 195 L304 170 Z" fill="#a855f7" opacity="0.75"/>
    <!-- West Arrow -->
    <path d="M300 175 L254 155 L294 168 Z" fill="#6d28d9" opacity="0.65"/>
    <path d="M300 175 L254 155 L296 180 Z" fill="#8b5cf6" opacity="0.8"/>

    <!-- Central Amethyst Gemstone Core -->
    <circle cx="300" cy="175" r="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="3"/>
    <circle cx="300" cy="175" r="9" fill="url(#purpleGrad1)"/>
    <circle cx="297" cy="172" r="2.5" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Glowing Laser Pointer Marker -->
  <circle cx="332" cy="124" r="5" fill="#c084fc"/>
  <circle cx="332" cy="124" r="2" fill="#ffffff"/>

  <!-- Center Floating Pill Label below compass -->
  <g filter="url(#pShadow1)">
    <rect x="235" y="260" width="130" height="28" rx="14" fill="#ffffff" stroke="#ede9fe" stroke-width="1.5"/>
    <circle cx="251" cy="274" r="5" fill="#8b5cf6"/>
    <text x="296" y="278" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="9" font-weight="800" fill="#6d28d9" text-anchor="middle">360° STRATEGY</text>
  </g>
</svg>