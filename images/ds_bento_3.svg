<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 504 250" width="504" height="250" fill="none">
  <defs>
    <filter id="pShadow3" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4c1d95" flood-opacity="0.12"/>
    </filter>
    <filter id="pGlow3" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#8b5cf6" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="pillarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="35%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="pCardBg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>

  <!-- Connective flow lines -->
  <path d="M192 72 H245 Q255 72 255 82 V102" stroke="#c4b5fd" stroke-width="2.2" stroke-dasharray="5 4"/>
  <path d="M255 152 V172 Q255 182 265 182 H308" stroke="#c4b5fd" stroke-width="2.2" stroke-dasharray="5 4"/>

  <!-- Left Window: Competitive Market Benchmark -->
  <g filter="url(#pShadow3)">
    <rect x="38" y="26" width="158" height="150" rx="20" fill="#ffffff" stroke="#ede9fe" stroke-width="1.5"/>
    <circle cx="56" cy="42" r="3" fill="#c4b5fd"/>
    <circle cx="66" cy="42" r="3" fill="#c4b5fd"/>
    <circle cx="76" cy="42" r="3" fill="#c4b5fd"/>
    <rect x="90" y="38" width="62" height="8" rx="4" fill="#ede9fe"/>

    <rect x="48" y="56" width="138" height="110" rx="14" fill="url(#pCardBg3)"/>
    <text x="62" y="76" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="8" font-weight="800" fill="#6d28d9">MARKET CAPTURE</text>

    <!-- Benchmark Columns: Competitors (gray/dull) vs APPIEX Client (tall glowing purple) -->
    <!-- Competitor A -->
    <rect x="62" y="128" width="16" height="26" rx="4" fill="#cbd5e1"/>
    <!-- Competitor B -->
    <rect x="85" y="116" width="16" height="38" rx="4" fill="#94a3b8"/>
    <!-- Competitor C -->
    <rect x="108" y="104" width="16" height="50" rx="4" fill="#c4b5fd"/>
    <!-- APPIEX Client: Towering 3D Purple Pillar -->
    <rect x="131" y="82" width="22" height="72" rx="6" fill="url(#pillarGrad)"/>
    
    <!-- Crown over client pillar -->
    <path d="M136 74 L142 70 L148 74 L146 78 H138 Z" fill="#8b5cf6"/>
  </g>

  <!-- Center Badge: Brand Moat & Monopoly Core -->
  <g filter="url(#pGlow3)">
    <rect x="210" y="82" width="90" height="90" rx="26" fill="#ffffff" stroke="#ffffff" stroke-width="4"/>
    <rect x="216" y="88" width="78" height="78" rx="22" fill="url(#pCardBg3)"/>
    
    <!-- 3D Amethyst Crown / Shield Icon -->
    <circle cx="255" cy="120" r="20" fill="#ffffff" stroke="#ede9fe" stroke-width="1.5"/>
    <!-- Crown geometry -->
    <path d="M246 124 L244 114 L249 117 L255 111 L261 117 L266 114 L264 124 Z" fill="url(#pillarGrad)"/>
    <rect x="246" y="124" width="18" height="3" rx="1.5" fill="#5b21b6"/>

    <text x="255" y="152" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="8" font-weight="900" fill="#6d28d9" text-anchor="middle">LEADER #1</text>
  </g>

  <!-- Right Window: High-Conversion Brand Citadel -->
  <g filter="url(#pShadow3)">
    <rect x="308" y="74" width="158" height="150" rx="20" fill="#ffffff" stroke="#ede9fe" stroke-width="1.5"/>
    <circle cx="324" cy="90" r="3" fill="#c4b5fd"/>
    <circle cx="334" cy="90" r="3" fill="#c4b5fd"/>
    <circle cx="344" cy="90" r="3" fill="#c4b5fd"/>
    <rect x="358" y="86" width="56" height="8" rx="4" fill="#ede9fe"/>

    <rect x="318" y="102" width="138" height="110" rx="14" fill="url(#pCardBg3)"/>
    
    <!-- Brand Metric 1 -->
    <rect x="328" y="112" width="118" height="26" rx="8" fill="#ffffff"/>
    <circle cx="340" cy="125" r="5" fill="#8b5cf6"/>
    <rect x="352" y="119" width="54" height="6" rx="3" fill="#6d28d9"/>
    <rect x="352" y="128" width="36" height="4" rx="2" fill="#c4b5fd"/>
    <rect x="414" y="118" width="24" height="14" rx="7" fill="#f3e8ff"/>
    <text x="426" y="128" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="7" font-weight="800" fill="#7c3aed" text-anchor="middle">78%</text>

    <!-- Brand Metric 2 -->
    <rect x="328" y="144" width="118" height="26" rx="8" fill="#ffffff"/>
    <circle cx="340" cy="157" r="5" fill="#a855f7"/>
    <rect x="352" y="151" width="58" height="6" rx="3" fill="#6d28d9"/>
    <rect x="352" y="160" width="40" height="4" rx="2" fill="#c4b5fd"/>
    <rect x="414" y="150" width="24" height="14" rx="7" fill="#f3e8ff"/>
    <text x="426" y="160" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="7" font-weight="800" fill="#7c3aed" text-anchor="middle">+4.8x</text>

    <!-- Brand Moat Secured Pill -->
    <rect x="328" y="176" width="118" height="24" rx="8" fill="url(#pillarGrad)"/>
    <text x="387" y="191" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">BRAND MOAT ACTIVE</text>
  </g>
</svg>