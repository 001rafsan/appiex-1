name: Refresh lockfile once on migration PR

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.event.pull_request.number == 3 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate consistent npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to this PR branch if changed
        shell: bash
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already consistent"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: synchronize package-lock for reproducible installs"
          git push origin HEAD:${{ github.head_ref }}
